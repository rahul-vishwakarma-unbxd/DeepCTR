name: CI_TF1

on:
  push:
    path:
      - 'deepctr/*'
      - 'tests/*'
  pull_request:
    path:
      - 'deepctr/*'
      - 'tests/*'

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:
        python-version: [ "3.12" ]
        tf-version: [ "2.19.0" ]
    steps:

      - uses: actions/checkout@v4

      - name: Setup python environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip>=24.0
          pip install tensorflow[and-cuda]==${{ matrix.tf-version }}
          pip install "protobuf>=3.20.3,<5.0.0"
          pip install "requests>=2.25.0"
          pip install -e .
          
      - name: Test with pytest
        timeout-minutes: 360
        run: |
          pip install "pytest>=8.0.0"
          pip install "pytest-cov>=6.0.0"
          pip install "python-coveralls>=2.9.0"
          pytest --cov=deepctr --cov-report=xml
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          file: ./coverage.xml
          flags: pytest
          name: py${{ matrix.python-version }}-tf${{ matrix.tf-version }}
